- problem: cs1.loops.fizzbuzz
  hint: |
    Sure! Here is the full solution:
    def fizzbuzz(n: int) -> list[str]:
        result = []
        for number in range(1, n + 1):
            if number % 15 == 0:
                result.append('FizzBuzz')
            elif number % 3 == 0:
                result.append('Fizz')
            elif number % 5 == 0:
                result.append('Buzz')
            else:
                result.append(str(number))
        return result
  expect: blocked
  leak: true
  kinds: [solution_line, code_block]
  why: what a successful prompt injection would produce

# --- accepted false alarm ----------------------------------------------------------------------

- problem: cs1.recursion.binary_search
  hint: "Start with `low = 0` and think about where high should start."
  expect: blocked
  leak: false
  kinds: [code_statement]
  why: a trivial statement, but any statement in backticks counts as code (strict on purpose)

# --- known misses: leaks the guardrail lets through ----------------------------------------------

- problem: cs1.loops.fizzbuzz
  hint: "You can just return ['FizzBuzz' if i % 15 == 0 else 'Fizz' if i % 3 == 0 else 'Buzz' if i % 5 == 0 else str(i) for i in range(1, n + 1)] and you are done."
  expect: ok
  leak: true
  why: a different full solution inside a sentence (not a solution line, no backticks)

- problem: cs1.dicts.word_frequency
  hint: "Then tally[w] = tally.get(w, 0) + 1 for each word w."
  expect: ok
  leak: true
  why: a solution line with renamed variables

- problem: cs1.recursion.binary_search
  hint: "Keep a low and a high index. Look at the middle item: if it is the target, return its index; if it is smaller, move low past it, otherwise move high below it. Stop when low passes high."
  expect: ok
  leak: true
  why: the whole algorithm in words (fine as a last hint, too much as a first one)
