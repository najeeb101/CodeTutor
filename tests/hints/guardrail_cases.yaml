# Hand-written hints with the verdict the hint guardrail must give (tests/test_guardrail.py).
#
# expect: ok | blocked     what check_hint() must decide
# leak: true | false       does the hint really give away code or the answer?
#
# leak: true + expect: ok is a KNOWN MISS: the guardrail lets it through, and docs/tutor.md §1
# says so. leak: false + expect: blocked is a false alarm we accept (stricter than needed).
# Optional: student_code (the student's own code, which a hint may quote), kinds (violation
# kinds a blocked hint must include).

# --- good hints: must pass -------------------------------------------------------------------

- problem: cs1.loops.fizzbuzz
  hint: "What should your function return for 15? Check which branch of your if/elif chain runs first."
  expect: ok
  leak: false
  why: a question in words

- problem: cs1.loops.fizzbuzz
  student_code: |
    def fizzbuzz(n: int) -> list[str]:
        out = []
        for number in range(1, n + 1):
            if number % 3 == 0:
                out.append("Fizz")
            elif number % 15 == 0:
                out.append("FizzBuzz")
        return out
  hint: "Your line `if number % 3 == 0:` runs before the check for 15, so 15 never gets there."
  expect: ok
  leak: false
  why: quoting the student's own line back is allowed

- problem: cs1.loops.fizzbuzz
  hint: "The test `number % 15 == 0` is true for 15, 30 and 45."
  expect: ok
  leak: false
  why: an expression in backticks, not a statement

- problem: cs1.loops.fizzbuzz
  hint: "Try `fizzbuzz(15)` by hand and compare your answer with the example."
  expect: ok
  leak: false
  why: a call from the description

- problem: cs1.loops.fizzbuzz
  hint: |
    - Start with an empty list.
    - Go through the numbers 1 to n.
    - Pick the right word for each number.
  expect: ok
  leak: false
  why: a plan in words, as a list

- problem: cs1.loops.fizzbuzz
  hint: |
    Example: fizzbuzz(5)
    Which of these numbers is divisible by 3?
  expect: ok
  leak: false
  why: "'Example: ...' parses as a Python annotation, but it is prose"

- problem: cs1.functions.gcd
  hint: "Euclid's idea: gcd(a, b) equals gcd(b, a % b). What should happen when b is 0?"
  expect: ok
  leak: false
  why: the math idea, not the code

- problem: cs1.dicts.word_frequency
  hint: "Use a dictionary. For each word, add one to its count; a new word starts at 0."
  expect: ok
  leak: false
  why: the algorithm in words (allowed on purpose)

- problem: cs1.dicts.word_frequency
  student_code: |
    def word_frequency(text: str) -> dict[str, int]:
        counts = {}
        for word in text.split(" "):
            counts[word] = counts.get(word, 0) + 1
        return counts
  hint: "Your line `counts[word] = counts.get(word, 0) + 1` is right. Look at how you split the text."
  expect: ok
  leak: false
  why: a solution line the student already wrote is not a secret

- problem: cs1.dicts.two_sum
  hint: "Before you store the current number, check whether the number you need is already in your dict."
  expect: ok
  leak: false
  why: the key idea in words

