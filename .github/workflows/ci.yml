# CI: the same checks as on the laptop, on every push to main and on every pull request.
# Actions are pinned by commit SHA (a tag can be moved to other code; a SHA can't). The comment
# after each SHA names the release it belongs to.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"

jobs:
  python:
    name: make all (lint, tests, bank validation)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: make rl-data # dist/rl/ is git-ignored; without it one test_rl_train test skips
      - run: make all # db-up starts the pinned Postgres + pgvector image from compose.yaml
      - name: Generated files must match the committed ones
        run: git diff --exit-code

  docker-sandbox:
    name: make test-docker (hostile code in the Docker sandbox)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Pull the grading image (pinned by digest in grader/sandbox.py)
        run: docker pull "$(uv run python -c 'from codetutor.grader.sandbox import DOCKER_IMAGE; print(DOCKER_IMAGE)')"
      - run: make test-docker

  gvisor:
    # The hostile-code suite again, with the grading containers under gVisor (runsc), on both CPU
    # types. The laptop's Docker Desktop can't host it, so this job is the proof (Deploy Step 3).
    name: gVisor on ${{ matrix.runner }} (hostile code under runsc)
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Install gVisor (pinned release and hash)
        run: sudo deploy/install-gvisor.sh
      - name: Pull the grading image (pinned by digest in grader/sandbox.py)
        run: docker pull "$(uv run python -c 'from codetutor.grader.sandbox import DOCKER_IMAGE; print(DOCKER_IMAGE)')"
      - name: The hostile-code suite under gVisor
        run: TEST_SANDBOX_RUNTIME=runsc REQUIRE_RUNSC=1 make test-docker
      - name: What gVisor costs (CI runner, not a laptop)
        run: uv run python scripts/bench_sandbox.py --runtime runsc

  tutor-cpu:
    # The tutor without a GPU (Deploy Step 4): time three model sizes on the CPU, on the ARM runner
    # (closest free proxy of the Oracle server) and on amd64, then print the size rule's verdict.
    name: tutor on a CPU, ${{ matrix.runner }} (which model size?)
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: make db-up
      - name: Ollama on the CPU (pinned image)
        run: |
          docker run -d --name ollama -p 127.0.0.1:11434:11434 ollama/ollama:0.40.9@sha256:5c6707fcf2e1a30cffe2ecb7e315584fc87747c389327e4bc711c4959aa1eecc
          for _ in $(seq 60); do docker exec ollama ollama list >/dev/null 2>&1 && break; sleep 2; done
          for model in qwen2.5-coder:1.5b qwen2.5-coder:3b qwen2.5-coder:7b nomic-embed-text; do
            docker exec ollama ollama pull "$model"
          done
          lscpu | grep -E "Model name|^CPU\(s\)"; free -g | head -2
      - run: uv run alembic upgrade head && uv run python scripts/sync_problems.py
      - run: uv run python scripts/sync_notes.py
      - name: Time the models (smallest first)
        run: |
          uv run python scripts/bench_tutor_cpu.py --hints 12 \
            --model ollama/qwen2.5-coder:1.5b --model ollama/qwen2.5-coder:3b --model ollama/qwen2.5-coder:7b

  prod-images:
    # Build the 3 images and run the whole containerized app, on both CPU types. The server is
    # ARM (Oracle Always Free), so arm64 must work before we rent it.
    name: containers on ${{ matrix.runner }} (build, start, end-to-end)
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked # for the end-to-end checker
      - name: Install gVisor (the whole stack grades under it)
        run: sudo deploy/install-gvisor.sh
      - name: Throw-away secrets for this run only
        run: |
          umask 077
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env.prod
          echo "INSTRUCTOR_TOKEN=$(openssl rand -hex 24)" >> .env.prod
          echo "API_DB_PASSWORD=$(openssl rand -hex 24)" >> .env.prod
          echo "DEMO_DB_PASSWORD=$(openssl rand -hex 24)" >> .env.prod
          echo "SANDBOX_RUNTIME=runsc" >> .env.prod
      - run: make prod-build
      - run: make prod-up
      - run: make prod-e2e
      - name: The tutor in the stack (a small model on the CPU)
        run: |
          echo "TUTOR_MODEL=ollama/qwen2.5-coder:1.5b" >> .env.prod
          make prod-tutor-up
          make prod-e2e-hints
      - name: Public demo (a tiny simulated class, graded in the stack)
        run: |
          make prod-demo-data DEMO_LIMIT=60
          make prod-demo-up
          curl -sf http://127.0.0.1:8011/api/instructor/overview
          curl -s -o /dev/null -w "demo POST /api/guest: %{http_code}\n" -X POST http://127.0.0.1:8011/api/guest
      - name: Browser checks (Chrome is preinstalled on the amd64 runner)
        if: matrix.runner == 'ubuntu-24.04'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run the browser checks
        if: matrix.runner == 'ubuntu-24.04'
        run: CHROME="$(command -v google-chrome)" CHROME_FLAGS="--no-sandbox" E2E_DEMO=1 E2E_SKIP_HINTS=0 make prod-web-e2e
      - name: Container logs (only when something failed)
        if: failure()
        run: |
          DOCKER_GID=$(stat -c %g /var/run/docker.sock) \
            docker compose -f compose.prod.yaml --env-file .env.prod ps -a
          DOCKER_GID=$(stat -c %g /var/run/docker.sock) \
            docker compose -f compose.prod.yaml --env-file .env.prod logs --no-color --tail 200
      - run: make prod-down
        if: always()

  web:
    name: make web-check (type check + production build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install
      - run: make web-check
