# The whole app in containers: the same images on the laptop and on the server (docs/deploy.md).
# Run it through make (prod-build / prod-up / prod-down), which passes --env-file .env.prod and
# DOCKER_GID. Ports are published on 127.0.0.1 only; on the server, a web server in front
# (Deploy Step 5) is the only thing reachable from the internet.
#
# Since Deploy Step 2a: guest sessions only (no dev login), the API connects as its own
# database role (no hidden tests), size and abuse limits. Still to come: the web UI's guest
# login (2b) and a stronger grading sandbox (Step 3).

name: codetutor-prod

x-logging: &logging
  # Logs rotate, so they can't fill the server's disk: at most 3 files of 10 MB per service.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: codetutor-app
  build:
    context: .
    dockerfile: deploy/app.Dockerfile
  restart: unless-stopped
  logging: *logging
  read_only: true
  tmpfs:
    - /tmp
  environment:
    DATABASE_URL: postgresql://codetutor:${POSTGRES_PASSWORD:?set it in .env.prod}@db:5432/codetutor

services:
  db:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: codetutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env.prod}
      POSTGRES_DB: codetutor
    # No published port: only the other containers can reach the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codetutor -d codetutor"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs once and exits: create/upgrade the tables, (re)build the API's database role, then
  # copy the problems in. The others wait for it, so only one sync ever runs at a time.
  migrate:
    <<: *app
    restart: "no"
    command:
      - sh
      - -c
      - alembic upgrade head && python scripts/db_roles.py && python scripts/sync_problems.py
    environment:
      DATABASE_URL: postgresql://codetutor:${POSTGRES_PASSWORD:?set it in .env.prod}@db:5432/codetutor
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set it in .env.prod}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command:
      - uvicorn
      - codetutor.api.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      # Its own role (db/roles.py): Postgres refuses the hidden tests and the hint trace.
      DATABASE_URL: postgresql://codetutor_api:${API_DB_PASSWORD:?set it in .env.prod}@db:5432/codetutor
      INSTRUCTOR_TOKEN: ${INSTRUCTOR_TOKEN:-}
      # Proxies in front of the API that append to X-Forwarded-For (api/guards.py).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    <<: *app
    command: ["python", "scripts/worker.py"]
    environment:
      DATABASE_URL: postgresql://codetutor:${POSTGRES_PASSWORD:?set it in .env.prod}@db:5432/codetutor
      SANDBOX_IMAGE: codetutor-sandbox
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
    # The Docker socket lets the worker start the grading containers. Whoever holds it is as
    # powerful as root on this machine (true for any process that runs `docker`); student code
    # never sees it: it runs in codetutor-sandbox containers (docs/deploy.md).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?run through make, which sets it}"
    stop_grace_period: 60s # finish the job being graded (SIGTERM = stop after the current job)
    depends_on:
      migrate:
        condition: service_completed_successfully

  # --- The AI tutor (Deploy Step 4): a small model on the CPU, in this stack ---------------------
  # Profile `tutor`; `make prod-tutor-up` pulls the models, embeds the course notes, starts the
  # worker. Student code never leaves the machine: Ollama has no published port.
  ollama:
    # Pinned by digest, amd64 + arm64 (0.40.9 was 17 days old when pinned, 2026-11-09).
    image: ollama/ollama:0.40.9@sha256:5c6707fcf2e1a30cffe2ecb7e315584fc87747c389327e4bc711c4959aa1eecc
    profiles: ["tutor"]
    restart: unless-stopped
    logging: *logging
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1" # one hint at a time: the CPU is the limit
      OLLAMA_MAX_LOADED_MODELS: "2" # the hint model + the embedder
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  tutor-models:
    image: ollama/ollama:0.40.9@sha256:5c6707fcf2e1a30cffe2ecb7e315584fc87747c389327e4bc711c4959aa1eecc
    profiles: ["tutor-data"]
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - ollama pull "$${TUTOR_MODEL#ollama/}" && ollama pull nomic-embed-text
    environment:
      OLLAMA_HOST: http://ollama:11434
      TUTOR_MODEL: ${TUTOR_MODEL:-ollama/qwen2.5-coder:1.5b}
    depends_on:
      ollama:
        condition: service_healthy

  tutor-notes:
    <<: *app
    profiles: ["tutor-data"]
    restart: "no"
    command: ["python", "scripts/sync_notes.py"]
    environment:
      DATABASE_URL: postgresql://codetutor:${POSTGRES_PASSWORD:?set it in .env.prod}@db:5432/codetutor
      OLLAMA_BASE_URL: http://ollama:11434/v1
    depends_on:
      ollama:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  tutor:
    <<: *app
    profiles: ["tutor"]
    command: ["python", "scripts/tutor_worker.py"]
    environment:
      DATABASE_URL: postgresql://codetutor:${POSTGRES_PASSWORD:?set it in .env.prod}@db:5432/codetutor
      OLLAMA_BASE_URL: http://ollama:11434/v1
      TUTOR_MODEL: ${TUTOR_MODEL:-ollama/qwen2.5-coder:1.5b}
    depends_on:
      ollama:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: codetutor-web
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    logging: *logging
    read_only: true
    tmpfs:
      - /tmp
      - /web/.next/cache:uid=1000,gid=1000
    environment:
      CODETUTOR_API_URL: http://api:8000
      CODETUTOR_DEMO_API_URL: http://demo-api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3200}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12

  # --- The public demo (Deploy Step 2c): the teacher view of a SIMULATED class -----------------
  # Its own database (codetutor_sim_s1, 60 invented students), its own read-only role, its own
  # process. `make prod-demo-data` builds and grades the class once (~13 min); `make
  # prod-demo-up` then starts demo-api. None of this touches the real database.
  demo-seed:
    <<: *app
    profiles: ["demo-data"]
    restart: "no"
    command:
      - sh
      - -c
      - >-
        python scripts/sim_cohort.py reset-db --seed 1 &&
        python scripts/sim_cohort.py load --seed 1 $${DEMO_LIMIT:+--limit $$DEMO_LIMIT} &&
        python scripts/db_roles.py --demo
    environment:
      DATABASE_URL: postgresql://codetutor:${POSTGRES_PASSWORD:?set it in .env.prod}@db:5432/codetutor_sim_s1
      SIM_DATABASE_URL: postgresql://codetutor:${POSTGRES_PASSWORD:?set it in .env.prod}@db:5432/codetutor_sim
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:?set it in .env.prod}
      DEMO_LIMIT: ${DEMO_LIMIT:-}
    depends_on:
      db:
        condition: service_healthy

  demo-grade:
    <<: *app
    profiles: ["demo-data"]
    restart: "no"
    command:
      - sh
      - -c
      - >-
        pids=""; for i in 1 2 3 4; do python scripts/worker.py --drain & pids="$$pids $$!"; done;
        status=0; for pid in $$pids; do wait $$pid || status=1; done; exit $$status
    environment:
      DATABASE_URL: postgresql://codetutor:${POSTGRES_PASSWORD:?set it in .env.prod}@db:5432/codetutor_sim_s1
      SANDBOX_IMAGE: codetutor-sandbox
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?run through make, which sets it}"
    depends_on:
      db:
        condition: service_healthy

  demo-flags:
    <<: *app
    profiles: ["demo-data"]
    restart: "no"
    command: ["python", "scripts/integrity.py", "run", "--seed", "1"]
    environment:
      SIM_DATABASE_URL: postgresql://codetutor:${POSTGRES_PASSWORD:?set it in .env.prod}@db:5432/codetutor_sim
    depends_on:
      db:
        condition: service_healthy

  demo-api:
    <<: *app
    profiles: ["demo"]
    command:
      - uvicorn
      - codetutor.api.demo:create_demo_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      # The read-only role, on the simulation database only (api/demo.py refuses any other name).
      DATABASE_URL: postgresql://codetutor_demo:${DEMO_DB_PASSWORD:?set it in .env.prod}@db:5432/codetutor_sim_s1
    ports:
      - "127.0.0.1:${DEMO_API_PORT:-8011}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12

  # Not a running service: `make prod-build` builds it, the worker starts one container of it
  # per submission. Profile "build" keeps `up` from starting it.
  sandbox:
    image: codetutor-sandbox
    build:
      context: .
      dockerfile: deploy/sandbox.Dockerfile
    profiles: ["build"]

volumes:
  pgdata:
  ollama-models:
