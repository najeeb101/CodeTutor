id: cs1.recursion.binary_search
version: 1
title: Binary Search
module: 8
module_name: "Recursion & Problem Solving"
order: 4
difficulty: medium
concepts: [searching, lists, edge_cases]
function_name: binary_search
description_en: |
  Write a function `binary_search(nums, target)` that returns the index of `target` in the
  sorted list `nums`, or -1 if `target` is not in the list.

  - `nums` is sorted from small to large and has no repeated values. It can be empty.
  - `target` is an integer.
  - Try to use binary search: look at the middle item and throw away the half that cannot
    contain the target, again and again. (This is not checked; a simple scan through the
    list also passes. The goal is to practise the idea.)
  - Return an integer.

  Examples:
    binary_search([1, 3, 5, 7, 9], 7) -> 3
    binary_search([1, 3, 5, 7, 9], 4) -> -1
description_ar: null
hints:
  - "Test the first and the last item, a list with one item, an empty list, and targets smaller or bigger than every item."
  - "Keep two positions, low and high, for the part of the list that can still contain the target. Look at the middle position and move low or high past it. Stop when the part is empty."
  - "Set low = 0 and high = len(nums) - 1. While low <= high: middle = (low + high) // 2; return middle if nums[middle] == target; if nums[middle] < target, set low = middle + 1, else high = middle - 1. Return -1 after the loop."
author: claude
