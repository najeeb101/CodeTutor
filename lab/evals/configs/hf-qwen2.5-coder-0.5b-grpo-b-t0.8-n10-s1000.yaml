# Week 7 Step 1 (eval noise): the SAME model as the file without -s1000, only the sampling draw differs.
# Official "after" run for GRPO fold b, training seed 0 (Week 6 Step 6): the 0.5B plus the adapter trained on fold b.
# The same settings as the baseline (hf-qwen2.5-coder-0.5b-bf16-t0.8-n10.yaml); only `adapter` is new.
# Run: make rl-after-run RUN=b   (needs the `rl` packages, Ollama idle, mains power; resumable)
run_id: hf-qwen2.5-coder-0.5b-grpo-b-t0.8-n10-s1000
model: hf/Qwen/Qwen2.5-Coder-0.5B-Instruct
adapter: lab/rl/adapters/fold-b   # LoRA weights from `make rl-train FOLD=b`, copied here
samples: 10
temperature: 0.8
max_tokens: 1024
seed_base: 1000   # Week 7 noise check: batch seed HF_SEED + 1000
sandbox: docker
