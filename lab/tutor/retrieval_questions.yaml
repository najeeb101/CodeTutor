# Labelled questions for the retrieval eval (scripts/eval_retrieval.py, docs/tutor.md §2).
#
# question: what a student might type.   style: concept (asks about an idea by name) or
# symptom (describes what goes wrong, often an error message).
# relevant: the note sections (chunk ids) that answer it; a search "hits" when any of them is
# in its top k. Two ids only where both sections really answer the question.
#
# Written by Claude on 2026-10-03, from the bank's buggy files, BEFORE the notes existed; the ids
# were added after. Same author as the notes, so the numbers are optimistic (docs/tutor.md §2).

