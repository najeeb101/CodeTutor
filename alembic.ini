# Alembic: database migrations (Week 3). Usually run through `make db-migrate`.
# How to change the schema: docs/database.md.
#
# There is no database URL in this file on purpose: env.py takes it from codetutor.settings
# (DATABASE_URL, else the local dev database), so a real password never lands in git.

[alembic]
script_location = %(here)s/src/codetutor/db/migrations
# Readable file names: versions/0001_initial_schema.py. Give the next one --rev-id 0002.
file_template = %%(rev)s_%%(slug)s
path_separator = os

[post_write_hooks]
# New migration files get the same import order (I) and formatting as the rest of the code.
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --select I --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
